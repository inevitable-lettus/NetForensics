name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            user-docs/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r user-docs/requirements.txt
      - name: Generate the sample captures the examples use
        run: python scripts/make_synthetic_pcaps.py
      - name: CLI reference matches the argparse parser
        run: python scripts/gen_cli_reference.py --check
      - name: Command output on the site matches the program
        run: python scripts/check_docs_examples.py
      - name: Build the site
        run: mkdocs build --strict
