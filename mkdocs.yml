# NetForensics user documentation. Built by Read the Docs (see .readthedocs.yaml),
# or locally:
#
#   python3 -m venv .venv-docs && .venv-docs/bin/pip install -r user-docs/requirements.txt
#   .venv-docs/bin/mkdocs serve          # http://127.0.0.1:8000, live reload
#   .venv-docs/bin/mkdocs build --strict # what Read the Docs runs
#
# The CLI reference (reference/cli.md) and every command output shown on the site are
# generated by scripts/gen_cli_reference.py and scripts/check_docs_examples.py; CI fails
# when either is out of date.

site_name: NetForensics
site_description: >-
  NetForensics: an explainable packet-forensics tool that seals a capture, shows why each
  finding fired, and proves later whether the evidence was altered.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://netforensics.readthedocs.io/"]
repo_url: https://github.com/inevitable-lettus/NetForensics
repo_name: inevitable-lettus/NetForensics
docs_dir: user-docs
exclude_docs: |
  requirements.txt
  examples/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Quick start: getting-started/quick-start.md
      - Your first investigation: getting-started/first-investigation.md
  - User guide:
      - guide/index.md
      - seal: guide/seal.md
      - analyze: guide/analyze.md
      - verify: guide/verify.md
      - retry-timestamps: guide/retry-timestamps.md
      - tamper-demo: guide/tamper-demo.md
  - Concepts:
      - concepts/index.md
      - Flows: concepts/flows.md
      - The detectors: concepts/detectors.md
      - The evidence layer: concepts/evidence-layer.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Findings: reference/findings.md
      - Storage layout: reference/storage.md
      - Limits: reference/limits.md
  - Design:
      - design/index.md
      - Worked math: design/worked-math.md
  - Help:
      - help/index.md
      - Troubleshooting: help/troubleshooting.md
      - FAQ: help/faq.md
      - Known limitations: help/known-limitations.md
